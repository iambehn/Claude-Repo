# Marvel Rivals — medal / multi-kill icon definitions
# Schema: assets/ontology/medals.schema.yaml
#
# Status: draft placeholders — source_url and CV fields are null until
# the asset ingester runs against official Marvel Rivals pages.
#
# Populate source_url by locating medal icons on:
#   https://marvelrivals.fandom.com/wiki/ or official pages
# Then run the asset normalizer to generate master_path / template_path / mask_path.
#
medals:
  - asset_id: marvel_rivals.medal.elimination
    medal_id: elimination
    game_id: marvel_rivals
    display_name: Elimination
    medal_class: kill
    rarity: common
    source_url: ~
    fetch_timestamp: ~
    file_hash: ~
    is_temporary_art: false
    master_path: ~
    template_path: ~
    mask_path: ~
    roi_ref: hud.medal_popup
    match_method: TM_CCORR_NORMED
    threshold: 0.93
    scale_set: [0.75, 0.875, 1.0, 1.125]
    temporal_window: 4
    source_license_note: internal_review_required
    qa_status: draft
    patch_tag: "2026-04"

